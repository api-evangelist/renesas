name: Renesas
description: >-
  Renesas Electronics Corporation (TYO: 6723) is a global semiconductor
  manufacturer producing microcontrollers and microprocessors (RA, RX, RL78,
  RH850, RZ, Synergy families), analog, power, sensor, timing, connectivity, and
  memory products for automotive, industrial, infrastructure, and consumer
  electronics applications. On the developer side Renesas operates a public
  developer portal at developer.renesas.com whose flagship programmable interface
  is the Renesas Web Data API — a REST API that lets approved partners and
  integrators retrieve Renesas product metadata (products, product parts,
  documents, boards & kits, packages, and software tools) in real time instead of
  relying on manual CSV downloads or periodic feed refreshes. The API is
  documented on a Redocly Realm site, ships an OpenAPI 3.0.0 description, an
  auto-generated Model Context Protocol (MCP) server, a browser Try-It console,
  and a semantic-versioned changelog.
