  /product-parts/search:
    post:
      tags:
      - Product Part
      security:
      - ApiKeyAuth: []
      summary: Parametric Search for Product Parts
      description: Search for product parts within a specific product using parametric attributes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - productId
              properties:
                productId:
                  type: string
                  description: The product identifier to search within (required).
                  example: RA2A1
                limit:
                  type: integer
                  description: The number of results to return (default 10).
                  minimum: 1
                  maximum: 100
                  default: 10
                offset:
                  type: integer
                  description: The page number for pagination (default 0). This is multiplied by limit to get the actual offset.
                  minimum: 0
                  default: 0
                filters:
                  type: array
                  description: Array of parametric attribute filters.
                  items:
                    type: object
                    required:
                    - productPartAttributeId
                    properties:
                      productPartAttributeId:
                        type: string
                        description: The attribute identifier to filter by.
                        example: field__segment_lcd_controller
                      values:
                        type: array
                        description: Values to match (OR operation within this array).
                        items:
                          oneOf:
                          - type: string
                          - type: number
                          - type: boolean
                        example:
                        - 'Yes'
                        - Available
                      operator:
                        type: string
                        description: Comparison operator for numeric values.
                        enum:
                        - eq
                        - gt
                        - gte
                        - lt
                        - lte
                        - range
                        default: eq
                      min:
                        type: number
                        description: Minimum value for range operator.
                      max:
                        type: number
                        description: Maximum value for range operator.
            example:
              productId: RA2A1
              limit: 20
              offset: 0
              filters:
              - productPartAttributeId: field__operating_frequency
                operator: gte
                min: 48
              - productPartAttributeId: field__package_type
                values:
                - LQFP
                - QFN
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        orderableId:
                          type: string
                          description: Orderable product part identifier.
                        genericId:
                          type: string
                          description: Generic product identifier.
                        status:
                          type: string
                          description: Part status.
                        parametricAttributes:
                          type: array
                          description: Array of parametric attribute objects.
                          items:
                            type: object
                            properties:
                              productPartAttributeId:
                                type: string
                              attributeValues:
                                type: array
                                items:
                                  oneOf:
                                  - type: string
                                  - type: number
                                  - type: boolean
                                  - type: object
                              attributeName:
                                type: string
                              href:
                                type: string
                                format: uri
                        href:
                          type: string
                          format: uri
                          description: URL to the full product part details.
                  pagination:
                    type: object
                    properties:
                      offset:
                        type: integer
                        description: The actual offset used (page * limit)
                      limit:
                        type: integer
                        description: The number of items per page
                      total:
                        type: integer
                        description: Total number of items matching the search
                      has_more:
                        type: boolean
                        description: Whether there are more items available
                  filters:
                    type: object
                    description: The filters that were applied.
              example:
                data:
                - orderableId: R7FA2A1AB3CFM#AA0
                  genericId: RA2A1
                  status: Active
                  parametricAttributes:
                  - productPartAttributeId: field__operating_frequency
                    attributeValues:
                    - 48
                    attributeName: Operating Frequency (MHz)
                    href: /product-parts/attributes/field__operating_frequency
                  - productPartAttributeId: field__package_type
                    attributeValues:
                    - LQFP
                    attributeName: Package Type
                    href: /product-parts/attributes/field__package_type
                  - productPartAttributeId: field__pin_count
                    attributeValues:
                    - 48
                    attributeName: Pin Count
                    href: /product-parts/attributes/field__pin_count
                  - productPartAttributeId: field__flash_memory_kb
                    attributeValues:
                    - 256
                    attributeName: Flash Memory (KB)
                    href: /product-parts/attributes/field__flash_memory_kb
                  - productPartAttributeId: field__ram_kb
                    attributeValues:
                    - 32
                    attributeName: RAM (KB)
                    href: /product-parts/attributes/field__ram_kb
                  href: /product-parts/R7FA2A1AB3CFM%23AA0
                - orderableId: R7FA2A1AB3CFM#BA0
                  genericId: RA2A1
                  status: Active
                  parametricAttributes:
                  - productPartAttributeId: field__operating_frequency
                    attributeValues:
                    - 48
                    attributeName: Operating Frequency (MHz)
                    href: /product-parts/attributes/field__operating_frequency
                  - productPartAttributeId: field__package_type
                    attributeValues:
                    - LQFP
                    attributeName: Package Type
                    href: /product-parts/attributes/field__package_type
                  - productPartAttributeId: field__pin_count
                    attributeValues:
                    - 48
                    attributeName: Pin Count
                    href: /product-parts/attributes/field__pin_count
                  - productPartAttributeId: field__flash_memory_kb
                    attributeValues:
                    - 256
                    attributeName: Flash Memory (KB)
                    href: /product-parts/attributes/field__flash_memory_kb
                  - productPartAttributeId: field__ram_kb
                    attributeValues:
                    - 32
                    attributeName: RAM (KB)
                    href: /product-parts/attributes/field__ram_kb
                  href: /product-parts/R7FA2A1AB3CFM%23BA0
                - orderableId: R7FA2A1AB3CNF#AA0
                  genericId: RA2A1
                  status: Active
                  parametricAttributes:
                  - productPartAttributeId: field__operating_frequency
                    attributeValues:
                    - 48
                    attributeName: Operating Frequency (MHz)
                    href: /product-parts/attributes/field__operating_frequency
                  - productPartAttributeId: field__package_type
                    attributeValues:
                    - QFN
                    attributeName: Package Type
                    href: /product-parts/attributes/field__package_type
                  - productPartAttributeId: field__pin_count
                    attributeValues:
                    - 40
                    attributeName: Pin Count
                    href: /product-parts/attributes/field__pin_count
                  - productPartAttributeId: field__flash_memory_kb
                    attributeValues:
                    - 256
                    attributeName: Flash Memory (KB)
                    href: /product-parts/attributes/field__flash_memory_kb
                  - productPartAttributeId: field__ram_kb
                    attributeValues:
                    - 32
                    attributeName: RAM (KB)
                    href: /product-parts/attributes/field__ram_kb
                  href: /product-parts/R7FA2A1AB3CNF%23AA0
                pagination:
                  offset: 0
                  limit: 20
                  total: 7
                  has_more: false
                filters:
                  productId: RA2A1
                  applied:
                  - productPartAttributeId: field__operating_frequency
                    operator: gte
                    min: 48
                  - productPartAttributeId: field__package_type
                    values:
                    - LQFP
                    - QFN
        '400':
          description: Bad request - missing required productId or invalid filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: productId is required
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Product with ID 'RA2A1' not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Failed to perform parametric search
  /product-parts/attributes:
    get:
      tags:
      - Product Part
      security:
      - ApiKeyAuth: []
      summary: Get All Product Part Attributes
      description: List all available parametric attributes that can be used for filtering product parts.
      parameters:
      - name: limit
        in: query
        description: The number of results to return (default 50).
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        description: The page number for pagination (default 0). This is multiplied by limit to get the actual offset.
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: productId
        in: query
        description: Filter attributes by product ID to get only attributes relevant to that product.
        required: false
        schema:
          type: string
        example: RA2A1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/product_part_attribute'
                  pagination:
                    type: object
                    properties:
                      offset:
                        type: integer
                        description: The actual offset used (page * limit)
                      limit:
                        type: integer
                        description: The number of items per page
                      total:
                        type: integer
                        description: Total number of attributes available
                      has_more:
                        type: boolean
                        description: Whether there are more items available
              example:
                data:
                - productPartAttributeId: field__operating_frequency
                  attributeName: Operating Frequency (MHz)
                  attributeType: numeric
                  description: Maximum operating frequency of the microcontroller
                  unit: MHz
                  filterType: range
                - productPartAttributeId: field__package_type
                  attributeName: Package Type
