  /product-parts/attributes/{productPartAttributeId}:
    get:
      tags:
      - Product Part
      security:
      - ApiKeyAuth: []
      summary: Get Product Part Attribute by ID
      parameters:
      - name: productPartAttributeId
        in: path
        required: true
        description: The unique identifier of the product part attribute.
        schema:
          type: string
        example: field__operating_frequency
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/product_part_attribute'
              example:
                productPartAttributeId: field__operating_frequency
                attributeName: Operating Frequency (MHz)
                attributeType: numeric
                description: Maximum operating frequency of the microcontroller
                unit: MHz
                filterType: range
        '404':
          description: Product part attribute not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Product part attribute with ID 'field__invalid' not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Failed to retrieve product part attribute
  /product-parts/cross-reference:
    post:
      tags:
      - Product Part
      security:
      - ApiKeyAuth: []
      summary: Cross Reference Product Parts
      description: 'Find Renesas replacement parts for up to 200 competitor part numbers per request. Inputs with no matches are included in the response with an empty `results` array.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - partNumbers
              properties:
                partNumbers:
                  type: array
                  description: List of competitor part numbers to look up. Maximum 200.
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
            example:
              partNumbers:
              - STM32F103C8T6
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: One entry per input part number, in request order.
                    items:
                      type: object
                      properties:
                        partNumber:
                          type: string
                          description: The input part number this entry corresponds to.
                        results:
                          type: array
                          description: Matching Renesas parts. Empty array if no cross-references were found.
                          items:
                            type: object
                            properties:
                              crossPartNumber:
                                type: string
                                description: The competitor part number as stored in the cross-reference database.
                              crossManufacturer:
                                type: string
                                description: Manufacturer of the competitor part.
                              matchType:
                                type: string
                                description: 'How closely the Renesas part matches the queried part.

                                  - `Drop-in` — Pin-for-Pin Replacement. Form, fit, function, and all electrical specifications are identical.

                                  - `Footprint` — Pin Equivalent, but electrical specifications are not identical. Minor redesign may be needed, but board re-layout may not be needed.

                                  - `Functional` — Equivalent part, but pin configuration is not similar. Minor redesign and board re-layout may be required.

                                  '
                                enum:
                                - Drop-in
                                - Footprint
                                - Functional
                              orderableId:
                                type: string
                                description: Renesas orderable part number, present when matched via orderable ID.
                              genericId:
                                type: string
                                description: Renesas generic product identifier, present when matched via generic ID.
                              status:
                                type: string
                                description: Part lifecycle status.
                              comments:
                                type: string
                                description: Any notes or caveats about this cross-reference match.
                              description:
                                type: string
                                description: Renesas part description.
                              dataSource:
                                type: string
                                description: Origin of this cross-reference record.
                                enum:
                                - Renesas Database
                              href:
                                type: string
                                format: uri
                                description: URL to the full product part details.
              example:
                data:
                - partNumber: STM32F103C8T6
                  results:
                  - crossPartNumber: STM32F103C8T6
                    crossManufacturer: STMicroelectronics
                    matchType: Functional
                    genericId: RX63T
                    status: Active
                    comments: 32-bit Microcontrollers for Motor Control Enhancing the Precision of Inverter/Converter Control
                    description: Like the RX62T Group, the high performance (max. 100 MHz) of this microcontroller makes it ideal for motor control. On-chip functions include multifunction timers (MTU3 and GPT) that facilitate mot...
                    dataSource: Renesas Database
                    href: /product-parts/RX63T
                  - crossPartNumber: STM32F103C8T6
                    crossManufacturer: STMicroelectronics
                    matchType: Functional
                    orderableId: R5F563T5EDFL#10
                    genericId: RX63T
                    status: NRND
                    comments: 32-bit Microcontrollers for Motor Control Enhancing the Precision of Inverter/Converter Control
                    description: Like the RX62T Group, the high performance (max. 100 MHz) of this microcontroller makes it ideal for motor control. On-chip functions include multifunction timers (MTU3 and GPT) that facilitate mot...
                    dataSource: Renesas Database
                    href: /product-parts/R5F563T5EDFL%2310
                  - crossPartNumber: STM32F103C8T6
                    crossManufacturer: STMicroelectronics
                    matchType: Functional
                    orderableId: R5F563T5EDFL#V0
                    genericId: RX63T
                    status: NRND
                    comments: 32-bit Microcontrollers for Motor Control Enhancing the Precision of Inverter/Converter Control
                    description: Like the RX62T Group, the high performance (max. 100 MHz) of this microcontroller makes it ideal for motor control. On-chip functions include multifunction timers (MTU3 and GPT) that facilitate mot...
                    dataSource: Renesas Database
                    href: /product-parts/R5F563T5EDFL%23V0
                  - crossPartNumber: STM32F103C8T6
                    crossManufacturer: STMicroelectronics
                    matchType: Functional
                    orderableId: R5F563T5EGFL#V0
                    genericId: RX63T
                    status: NRND
                    comments: 32-bit Microcontrollers for Motor Control Enhancing the Precision of Inverter/Converter Control
                    description: Like the RX62T Group, the high performance (max. 100 MHz) of this microcontroller makes it ideal for motor control. On-chip functions include multifunction timers (MTU3 and GPT) that facilitate mot...
                    dataSource: Renesas Database
                    href: /product-parts/R5F563T5EGFL%23V0
                  - crossPartNumber: STM32F103C8T6
                    crossManufacturer: STMicroelectronics
                    matchType: Functional
                    orderableId: R5F563T6EGFL#V0
                    genericId: RX63T
                    status: NRND
                    comments: 32-bit Microcontrollers for Motor Control Enhancing the Precision of Inverter/Converter Control
                    description: Like the RX62T Group, the high performance (max. 100 MHz) of this microcontroller makes it ideal for motor control. On-chip functions include multifunction timers (MTU3 and GPT) that facilitate mot...
                    dataSource: Renesas Database
                    href: /product-parts/R5F563T6EGFL%23V0
        '400':
          description: Bad request - missing or invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: partNumbers is required and must contain between 1 and 200 entries
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Failed to retrieve cross-reference results
components:
  schemas:
    product_part_attribute:
      type: object
      required:
      - productPartAttributeId
      properties:
        productPartAttributeId:
          type: string
          description: Unique identifier for the product part attribute.
    product_part:
      type: object
      properties:
        orderableId:
          type: string
          description: Unique identifier for the orderable product part.
          example: R5F100MJAFB#10
        productCategory:
          type: string
          description: Category of the product.
          example: Microcontrollers
        firstProductSubcategory:
          type: string
          description: First level subcategory of the product.
          example: RL78
        genericId:
          type: string
          description: Generic identifier of the product part.
          example: R5F100MJA
        genericTitle:
          type: string
          description: Generic title of the product part.
          example: RL78/L13 Microcontroller
        genericUrl:
          type: string
          format: uri
          description: URL for the generic product part page.
          example: /products/microcontrollers/rl78/r5f100mja
        productFamily:
          type: string
          description: Family of the product.
          example: RL78/L13
        1kuPrice:
          type: number
          format: float
          nullable: true
          description: Price for 1K units of the product part.
          example: 36.08
        budgetaryPrice:
          type: array
          description: Budgetary price breaks for the product part.
          items:
            type: object
            properties:
              units:
                type: integer
                description: Quantity break at which this price applies.
              price:
                type: number
                format: float
                description: Unit price at this quantity break.
              currency:
                type: string
                description: Currency of the price.
                example: USD
          example:
          - units: 1
            price: 43.29
            currency: USD
          - units: 100
            price: 40.59
            currency: USD
          - units: 1000
            price: 36.08
            currency: USD
        status:
          type: string
          enum:
          - Active
          - Obsolete
          - NRND
          description: Current status of the product part.
          example: Active
        type:
          type: string
          description: Type of the product part (e.g., IC, Module).
          example: IC
        description:
          type: string
          description: Description of the product part.
          example: RL78/L13 32-bit Microcontroller, 100-pin LQFP
        class:
          type: string
          nullable: true
          description: Classification of the product part.
          example: Microcontroller
        category:
          type: string
          nullable: true
          description: Category of the product part.
          example: MCU
        leadCount:
          type: integer
          minimum: 0
          description: Number of leads in the product part.
          example: 100
        dimensions:
          type: object
          properties:
            length:
              type: number
              format: float
              nullable: true
              description: Length of the product part.
              example: 14
            width:
              type: number
              format: float
              nullable: true
              description: Width of the product part.
              example: 14
            thickness:
              type: number
              format: float
              nullable: true
              description: Thickness of the product part.
              example: 1.4
            pitch:
              type: number
              format: float
              nullable: true
              description: Pitch of the product part.
              example: 0.5
        peakReflowTemperature:
          type: string
          nullable: true
          description: Peak reflow temperature for the product part.
          example: 260°C
        leadFree:
          type: boolean
          description: Indicates if the product part is lead-free.
          example: true
        partAvailability:
          type: string
          description: Availability status of the product part.
          example: In Stock
        featuredDocument:
          type: object
          properties:
            documentTitle:
              type: string
              description: Title of the featured document.
              example: 'RL78/L13 User''s Manual: Hardware'
            documentUrl:
              type: string
              format: uri
              description: URL of the featured document.
              example: https://www.renesas.com/en/document/mah/rl78l13-users-manual-hardware
        images:
          type: array
          items:
            type: string
            format: uri
          description: List of image URLs.
          example:
          - https://www.renesas.com/images/products/r5f100mja.jpg
        chipImage:
          type: string
          format: uri
          nullable: true
          description: URL of the chip image.
          example: https://www.renesas.com/sites/default/files/r7fa2e1a52dnh-chip.png
        regulatory:
          type: object
          properties:
            htsus:
              type: string
              nullable: true
              description: HTSUS classification.
              example: 8542.31.0001
            eccn:
              type: string
              nullable: true
              description: ECCN classification.
              example: EAR99
            moistureSensitivityLevel:
              type: string
              nullable: true
              description: Moisture Sensitivity Level (MSL).
              example: MSL3
            rohsCompliant:
              type: boolean
              description: Indicates if the product part is RoHS compliant.
              example: true
            chinaRohsCompliant:
              type: boolean
              description: Indicates if the product part complies with China RoHS.
              example: true
            hazardousMaterials:
              type: object
              properties:
                mercury:
                  type: boolean
                  example: false
                lead:
                  type: boolean
                  example: false
                halogen:
                  type: boolean
                  example: false
                cadmium:
                  type: boolean
                  example: false
                hexavalentChromium:
                  type: boolean
                  example: false
                pbde:
                  type: boolean
                  example: false
                pbb:
                  type: boolean
                  example: false
        lifecycle:
          type: string
          description: Lifecycle status of the product part.
          example: Active
        alternative:
          type: object
          properties:
            alternativeGenericId:
              type: string
              nullable: true
              description: Alternative generic ID for the product part.
              example: null
            alternativeNote:
              type: string
              nullable: true
              description: Additional notes on alternatives.
              example: null
        packaging:
          type: object
          properties:
            package:
              type: object
              properties:
                packageCode:
                  type: string
                  description: Code of the package.
                  example: pkg_20128
                href:
                  type: string
                  format: uri
                  description: URL for the package details.
                  example: /packages/pkg_20128
            carrierType:
              type: string
              description: Type of carrier (e.g., Tape & Reel, Tray).
              example: Tray
            packageCode:
              type: string
              description: Package code.
              example: LQFP100
            pbFreeCategory:
              type: string
              description: Pb-free category.
              example: e3
            jedecStandard:
              type: string
              description: JEDEC standard compliance.
              example: MS-026
            quantityPerCarrier:
              type: integer
              minimum: 0
              description: Quantity per carrier.
              example: 160
            quantityPerReel:
              type: integer
              minimum: 0
              nullable: true
              description: Quantity per reel.
              example: null
            reelSize:
              type: string
              nullable: true
              description: Reel size information.
              example: null
            tapePin1Quad:
              type: string
              nullable: true
              description: Tape pin 1 quadrant information.
              example: null
            tapePocketPitch:
              type: number
              format: float
              nullable: true
              description: Tape pocket pitch measurement.
              example: null
            packageUrl:
              type: string
              format: uri
              description: URL for packaging details.
              example: /packages/pkg_20128
            packageDescription:
              type: string
              description: Description of the packaging.
              example: 100-pin Plastic LQFP
            packageName:
              type: string
              description: Name of the package.
              example: LQFP
            prevCode:
              type: string
              nullable: true
              description: Previous package code if applicable.
              example: null
        plp:
          type: string
          nullable: true
          description: PLP termination information.
          example: null
        sampleable:
          type: boolean
          description: Indicates if the product part is sampleable.
          example: true
        directBuy:
          type: boolean
          description: Indicates if the product part is available for direct purchase.
          example: true
        replacementProduct:
          type: string
          nullable: true
          description: Replacement product identifier.
          example: null
        replacementProductRemark:
          type: string
          nullable: true
          description: Remarks about the replacement product.
          example: null
        distiInventory:
          type: object
          description: Distributor inventory data for the product part.
          example:
            value:
              Avnet:
                part: R5F100MJAFB#10
                quantity: 0
                distributorName: Avnet
                shoppingCartUrl: https://octopart.com/opatz8j6/a1?t=6mGMtfdr4Qcwqr5MhX7SeSwC9I
              Mouser:
