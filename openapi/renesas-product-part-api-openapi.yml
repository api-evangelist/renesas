                quantity: 259
                distributorName: Chip One Stop
                shoppingCartUrl: https://octopart.com/opatz8j6/a1?t=Sd4qnFxxO6OrLxpTKBwUmW2Z3nAO
            updated: '2024-01-15T10:30:00Z'
            inStock: 1
