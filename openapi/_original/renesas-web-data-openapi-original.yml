            Filter by document sub-type. Example values: `Core Module`, `Driver
            Package`, `FIT Module`, `FreeRTOS`, `Software Integration System
            Application Example`, `Development Environment`, `Middleware`,
            `Migration Guide`, `Peripherals - Analog`, `Peripherals - Built-in
            Memory`, `Peripherals - Clock`, `Peripherals - Communication`,
            `Peripherals - Other`, `Peripherals - Security`, `Peripherals -
            Timer`.
          required: false
          schema:
            type: string
        - name: category
          in: query
          description: Filter by the product category the document is associated with.
          required: false
          schema:
            type: string
        - name: documentRevisionDateStart
          in: query
          description: Filter by documents revised on or after this date (YYYY-MM-DD).
          required: false
          schema:
            type: string
            format: date
        - name: documentRevisionDateEnd
          in: query
          description: Filter by documents revised on or before this date (YYYY-MM-DD).
          required: false
          schema:
            type: string
            format: date
