  /product-parts/attributes:
    get:
      tags:
        - Product Part
      security:
        - ApiKeyAuth: []
      summary: Get All Product Part Attributes
      description: >-
        List all available parametric attributes that can be used for filtering
        product parts.
      parameters:
        - name: limit
          in: query
          description: The number of results to return (default 50).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: >-
            The page number for pagination (default 0). This is multiplied by
            limit to get the actual offset.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: productId
          in: query
          description: >-
            Filter attributes by product ID to get only attributes relevant to
            that product.
          required: false
          schema:
            type: string
          example: RA2A1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/product_part_attribute'
                  pagination:
                    type: object
                    properties:
                      offset:
                        type: integer
                        description: The actual offset used (page * limit)
                      limit:
                        type: integer
                        description: The number of items per page
                      total:
                        type: integer
                        description: Total number of attributes available
                      has_more:
                        type: boolean
                        description: Whether there are more items available
              example:
                data:
                  - productPartAttributeId: field__operating_frequency
                    attributeName: Operating Frequency (MHz)
                    attributeType: numeric
                    description: Maximum operating frequency of the microcontroller
                    unit: MHz
                    filterType: range
                  - productPartAttributeId: field__package_type
                    attributeName: Package Type
                    attributeType: string
                    description: Physical package type of the component
                    unit: null
                    filterType: select
                    possibleValues:
                      - LQFP
                      - QFN
                      - BGA
                      - TQFP
                  - productPartAttributeId: field__memory_flash_kb
                    attributeName: Flash Memory (KB)
                    attributeType: numeric
                    description: On-chip flash memory size
                    unit: KB
                    filterType: range
                  - productPartAttributeId: field__memory_ram_kb
                    attributeName: RAM (KB)
                    attributeType: numeric
                    description: On-chip RAM size
                    unit: KB
                    filterType: range
                  - productPartAttributeId: field__segment_lcd_controller
                    attributeName: Segment LCD Controller
                    attributeType: boolean
                    description: Has segment LCD controller
                    unit: null
                    filterType: boolean
                    possibleValues:
                      - 'Yes'
                      - 'No'
                pagination:
                  offset: 0
                  limit: 50
                  total: 127
                  has_more: true
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Failed to retrieve product part attributes
