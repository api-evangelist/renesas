              url: https://www.renesas.com/en/application/electronic-toll-gnss
    product_part:
      type: object
      properties:
        orderableId:
          type: string
          description: Unique identifier for the orderable product part.
          example: R5F100MJAFB#10
        productCategory:
          type: string
          description: Category of the product.
          example: Microcontrollers
        firstProductSubcategory:
          type: string
          description: First level subcategory of the product.
          example: RL78
        genericId:
          type: string
          description: Generic identifier of the product part.
          example: R5F100MJA
        genericTitle:
          type: string
          description: Generic title of the product part.
          example: RL78/L13 Microcontroller
        genericUrl:
          type: string
          format: uri
          description: URL for the generic product part page.
          example: /products/microcontrollers/rl78/r5f100mja
        productFamily:
          type: string
          description: Family of the product.
          example: RL78/L13
        1kuPrice:
          type: number
          format: float
          nullable: true
          description: Price for 1K units of the product part.
          example: 36.08
        budgetaryPrice:
          type: array
          description: Budgetary price breaks for the product part.
          items:
            type: object
            properties:
              units:
                type: integer
                description: Quantity break at which this price applies.
              price:
                type: number
                format: float
                description: Unit price at this quantity break.
              currency:
                type: string
                description: Currency of the price.
                example: USD
          example:
            - units: 1
              price: 43.29
              currency: USD
            - units: 100
              price: 40.59
              currency: USD
            - units: 1000
              price: 36.08
              currency: USD
        status:
          type: string
          enum:
            - Active
            - Obsolete
            - NRND
          description: Current status of the product part.
          example: Active
        type:
          type: string
          description: Type of the product part (e.g., IC, Module).
          example: IC
        description:
          type: string
          description: Description of the product part.
          example: RL78/L13 32-bit Microcontroller, 100-pin LQFP
        class:
          type: string
          nullable: true
          description: Classification of the product part.
          example: Microcontroller
        category:
          type: string
          nullable: true
          description: Category of the product part.
          example: MCU
        leadCount:
          type: integer
          minimum: 0
          description: Number of leads in the product part.
          example: 100
        dimensions:
          type: object
          properties:
            length:
              type: number
              format: float
              nullable: true
              description: Length of the product part.
              example: 14
            width:
              type: number
              format: float
              nullable: true
              description: Width of the product part.
              example: 14
            thickness:
              type: number
              format: float
              nullable: true
              description: Thickness of the product part.
              example: 1.4
            pitch:
              type: number
              format: float
              nullable: true
              description: Pitch of the product part.
              example: 0.5
        peakReflowTemperature:
          type: string
          nullable: true
          description: Peak reflow temperature for the product part.
          example: 260°C
