          in: query
          description: Filter by DCP Document ID prefix.
          required: false
          schema:
            type: string
        - name: productId
          in: query
          description: Filter by associated product ID.
          required: false
          schema:
            type: string
        - name: type
          in: query
          description: >
            Filter by document type. Example values: `Datasheet`, `Datasheet -
            Short-Form`, `Datasheet Addendum`, `Datasheet Change Notice Guide`,
