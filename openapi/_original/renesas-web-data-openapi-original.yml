  /software-tools:
    get:
      tags:
        - Software Tool
      security:
        - ApiKeyAuth: []
      summary: Get All Software Tools
      parameters:
        - name: limit
          in: query
          description: The number of results to return (default 10).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          description: >-
            The page number for pagination (default 0). This is multiplied by
            limit to get the actual offset.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: order
          in: query
          description: >-
            Sorting property (default sort is by www update date). Multiple
            sorts can be supplied by comma concatenation.
          required: false
          schema:
            type: string
            enum:
              - wwwUpdateDate
              - softwareToolName
              - softwareType
            default: wwwUpdateDate
          example: wwwUpdateDate,softwareToolName
        - name: orderDirection
          in: query
          description: >-
            Sorting direction (default is "desc"). Multiple directions can be
            defined for multiple sorts.
          required: false
          schema:
            type: string
            default: desc
          example: desc,asc
        - name: softwareToolName
          in: query
          description: Filter by software tool name using the "contains" behavior.
          required: false
          schema:
            type: string
        - name: softwareType
          in: query
          description: Filter by software tool type. This is a string exact match.
          required: false
          schema:
            type: string
            default: all
        - name: includeDiscontinued
          in: query
          description: >-
            Include discontinued software. Default listing only shows active
            software.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/software_tool'
                  pagination:
                    type: object
                    properties:
                      offset:
                        type: integer
                        description: The actual offset used (page * limit)
                      limit:
                        type: integer
                        description: The number of items per page
                      total:
                        type: integer
                        description: Total number of items available
                      has_more:
                        type: boolean
                        description: Whether there are more items available
