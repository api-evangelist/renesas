                  - softwareToolName: e² studio
                    wwwUpdateDate: '2024-01-15T10:30:00Z'
                    url: https://www.renesas.com/software-tool/e2-studio
                    uuid: 8cdd14dc-21a8-4e9e-9d4d-4a83042b4e48
                    shortDescription: >-
