  /product-parts/cross-reference:
    post:
      tags:
        - Product Part
      security:
        - ApiKeyAuth: []
      summary: Cross Reference Product Parts
      description: >
        Find Renesas replacement parts for up to 200 competitor part numbers per
        request. Inputs with no matches are included in the response with an
        empty `results` array.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - partNumbers
              properties:
                partNumbers:
                  type: array
                  description: List of competitor part numbers to look up. Maximum 200.
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
            example:
              partNumbers:
                - STM32F103C8T6
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: One entry per input part number, in request order.
                    items:
                      type: object
                      properties:
                        partNumber:
                          type: string
                          description: The input part number this entry corresponds to.
                        results:
                          type: array
                          description: >-
                            Matching Renesas parts. Empty array if no
                            cross-references were found.
                          items:
                            type: object
                            properties:
                              crossPartNumber:
                                type: string
                                description: >-
                                  The competitor part number as stored in the
                                  cross-reference database.
                              crossManufacturer:
                                type: string
                                description: Manufacturer of the competitor part.
                              matchType:
                                type: string
                                description: >
                                  How closely the Renesas part matches the
                                  queried part.

                                  - `Drop-in` — Pin-for-Pin Replacement. Form,
                                  fit, function, and all electrical
                                  specifications are identical.

                                  - `Footprint` — Pin Equivalent, but electrical
                                  specifications are not identical. Minor
                                  redesign may be needed, but board re-layout
                                  may not be needed.

                                  - `Functional` — Equivalent part, but pin
                                  configuration is not similar. Minor redesign
                                  and board re-layout may be required.
                                enum:
                                  - Drop-in
                                  - Footprint
                                  - Functional
                              orderableId:
                                type: string
                                description: >-
                                  Renesas orderable part number, present when
                                  matched via orderable ID.
                              genericId:
                                type: string
                                description: >-
                                  Renesas generic product identifier, present
                                  when matched via generic ID.
                              status:
                                type: string
                                description: Part lifecycle status.
                              comments:
                                type: string
                                description: >-
                                  Any notes or caveats about this
                                  cross-reference match.
                              description:
                                type: string
                                description: Renesas part description.
                              dataSource:
                                type: string
                                description: Origin of this cross-reference record.
                                enum:
                                  - Renesas Database
                              href:
                                type: string
                                format: uri
                                description: URL to the full product part details.
              example:
                data:
                  - partNumber: STM32F103C8T6
                    results:
                      - crossPartNumber: STM32F103C8T6
                        crossManufacturer: STMicroelectronics
                        matchType: Functional
                        genericId: RX63T
                        status: Active
                        comments: >-
                          32-bit Microcontrollers for Motor Control Enhancing
                          the Precision of Inverter/Converter Control
                        description: >-
                          Like the RX62T Group, the high performance (max. 100
                          MHz) of this microcontroller makes it ideal for motor
                          control. On-chip functions include multifunction
                          timers (MTU3 and GPT) that facilitate mot...
                        dataSource: Renesas Database
                        href: /product-parts/RX63T
                      - crossPartNumber: STM32F103C8T6
                        crossManufacturer: STMicroelectronics
                        matchType: Functional
                        orderableId: R5F563T5EDFL#10
                        genericId: RX63T
                        status: NRND
