          description: Partner information if applicable.
          items:
            type: object
            properties:
              name:
                type: string
                description: Partner company name.
              url:
                type: string
                format: uri
                nullable: true
                description: Partner website URL.
          example:
            - name: TESSERA Technology Inc.
              url: https://www.tessera.co.jp/eng/
    package:
      type: object
      properties:
        packageCode:
          type: string
          description: Unique identifier for the package (Package Code).
          example: pkg_20128
        wwwUpdateDate:
          type: string
          description: Date the package page was last updated on the website.
        url:
          type: string
          format: uri
          description: Public URL of the package page on the Renesas website.
          example: https://www.renesas.com/package/pkg20128
        uuid:
          type: string
          description: UUID of the package.
          example: b87ecb11-cd57-4204-b320-63c7dfd6525d
        title:
          type: string
          description: Title/name of the package.
          example: pkg_20128 (FCBGA 1368)
        packageType:
          type: string
          description: Type classification of the package.
          example: FCBGA
        packageName:
          type: string
          description: Name used to describe Renesas packages.
          example: PRBG1368KA-A
        category:
          type: string
          nullable: true
          description: Package category classification.
          example: IC
        class:
          type: string
          nullable: true
          description: Package class.
          example: IC
        description:
          type: string
          description: Descriptive text for this package.
          example: 'Terminal Material - Base: Sn-Ag-Cu'
        specifications:
          type: object
          description: Technical specifications of the package.
          properties:
            leadCount:
              type: integer
              description: Total number of leads/pins.
              example: 1368
            pitch:
              type: number
              description: Pin pitch in millimeters.
              example: 0.5
            length:
              type: number
              description: Package length in millimeters.
              example: 19
            width:
              type: number
              description: Package width in millimeters.
              example: 19
            thickness:
              type: number
              description: Package thickness/height in millimeters.
              example: 2.85
            dimensions:
              type: string
              description: Formatted package dimensions string.
              example: 19 x 19 x 2.85
            peakReflowTemp:
              type: number
              nullable: true
              description: Peak reflow temperature in °C.
            jeitaStandard:
              type: string
              nullable: true
              description: The JEITA standard to which the device is compliant.
            mark:
              type: string
              nullable: true
              description: Package mark/marking information.
        packageStatus:
          type: string
          description: Current status of the package.
          enum:
            - Active
            - Inactive
          example: Active
        regulatory:
          type: object
          description: Regulatory and compliance information.
          properties:
            leadFree:
              type: string
              description: Lead-free compliance status.
              enum:
                - 'Yes'
                - 'No'
              example: 'Yes'
            pbFreeCategory:
              type: string
              nullable: true
              description: Lead-free category classification.
        tubeOrTray:
          type: string
          nullable: true
          description: Packaging carrier type (tube/tray).
        previousCode:
          type: string
          nullable: true
          description: Package code maintained as part of the Renesas and Intersil merger.
        images:
          type: array
          description: Array of image URLs for the package.
          items:
            type: string
            format: uri
          example:
            - >-
              https://www.renesas.com/sites/default/files/styles/medium/public/media/images/fcbga-1368pin-pkg20128-chip_0.png
        chipImage:
          type: string
          format: uri
          description: URL of the chip image for this package.
          example: https://www.renesas.com/sites/default/files/pkg20128-chip.png
        relatedDocuments:
          type: array
          description: List of related document identifiers.
          items:
            type: object
            properties:
              agileId:
                type: string
                description: Agile ID of the document.
              dcpDocumentId:
                type: string
                nullable: true
                description: DCP Document ID, if applicable.
              title:
                type: string
                description: Document title.
              type:
                type: string
                description: Document type.
              language:
                type: string
                description: Document language.
              href:
                type: string
                format: uri
                description: Public URL of the document file.
          example:
            - agileId: X0141154
              dcpDocumentId: PRBG1368KA-A (RDK-G-001812)
              title: Package Drawing FCBGA 1368pin PRBG1368KA-A
              type: Package Drawing
              language: en
              href: >-
                https://api.renesas.com/web-data/v1/documents/PRBG1368KA-A%20%28RDK-G-001812%29
            - agileId: X0061760
              dcpDocumentId: R50ZZ0006EJ0100
              title: LGA Mounting Manual
              type: Mounting Manual
              language: en
              href: https://api.renesas.com/web-data/v1/documents/R50ZZ0006EJ0100
    software_tool:
      type: object
      properties:
        softwareToolName:
          type: string
          description: Unique identifier for the software tool (uses full title).
          example: RZ/G Verified Linux Package [4.4-CIP]
        wwwUpdateDate:
          type: string
          description: Date the software tool page was last updated on the website.
        url:
          type: string
          format: uri
          description: Public URL of the software tool page on the Renesas website.
          example: >-
            https://www.renesas.com/software-tool/rzg-verified-linux-package-44-cip
        uuid:
          type: string
          description: UUID of the software tool.
          example: 8cdd14dc-21a8-4e9e-9d4d-4a83042b4e48
        shortDescription:
          type: string
          description: Brief description of the software tool.
          example: >-
            This Linux package contains ported and tested basic software
            necessary for the industrial segment, and its operation and
            performance have been verified based on a datasheet. It enables you
            to start using a stable Linux environment and basic software
            immediately, so you can concentrate on developing your application.
        description:
          type: string
          description: Detailed description of the software tool.
          example: >-
            This product provides a whole set of software, which consists of
            Linux packages and software add-ons. Functions of this product have
            been verified under our development process management. Regular
            maintenance is also provided. You can greatly reduce the burden of
            software development in embedded system development by using this
            package. Please read the release note included in this product and
            'RZ/G Verified Linux Package Start-up Guide' first when you use the
            package. VLP[4.4-CIP] maintenance will be finished 2027/1H when the
            maintenance of the corresponding CIP Linux Kernel version is
            completed.
        softwareType:
          type: string
          description: Type classification of the software tool.
          example: Software Package
        parentSoftwareCategory:
          type: array
          description: Parent software category name.
          items:
            type: string
          example:
            - title: Tools to Optimize AI Software for AD/ADAS on R-Car SoC
        features:
          type: string
          description: Key features and capabilities of the software tool.
          example: >-
            Linux kernel (4.4-CIP or 4.4-CIP-RT), 10+ years support with CIP
            project cooperation, Device Driver, Media Player IF with GStreamer,
            Video Codec H.264 decoder/encoder (OMX), Video processing with
            scaling/clipping/compositing, Graphics function with OpenGL ES (SGX)
        additionalDetails:
          type: string
          nullable: true
          description: Additional technical details and specifications.
        documentationDetails:
          type: string
          nullable: true
          description: Details about documentation and help resources.
        downloadDetails:
          type: string
          nullable: true
          description: Information about downloads and installation.
        releaseInformation:
          type: string
          nullable: true
          description: Release notes and version information.
          example: >-
            Next release: 4.4-CIP version VLP 2.1.25 (end of Dec 2026). Latest:
            4.4-CIP version VLP 2.1.24 (Dec 26, 2025). Recent updates include
            VLP 2.1.23-update2 with both 4.4-CIP and 4.4-CIP-RT support.
        targetDeviceDescription:
          type: string
          nullable: true
          description: Description of target devices and compatibility.
          example: >-
            Target Reference Boards: iWave RZ/G1H-PF Development Kit, iWave
            RZ/G1M-PF Development Kit, iWave RZ/G1N-PF Development Kit, iWave
            RZ/G1E-PF Development Kit, iWave RZ/G1C-PF Development Kit. All
            targets support Standard Version.
        discontinued:
          type: boolean
          description: Whether the software tool has been discontinued.
          example: false
        externalUrl:
          type: string
          format: uri
          nullable: true
          description: External download or information URL.
        images:
          type: array
          description: Array of image URLs for the software tool.
          items:
            type: string
            format: uri
          example:
            - >-
              https://www.renesas.com/sites/default/files/e2studio-screenshot.png
