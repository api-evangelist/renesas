        parametricAttributes:
          type: array
          description: List of parametric attributes for the product part.
          items:
            type: object
            required:
              - productPartAttributeId
              - attributeName
              - href
              - attributeValues
            properties:
              productPartAttributeId:
                type: string
                description: Unique identifier for the product part attribute.
                example: field__segment_lcd_controller
              attributeName:
                type: string
                description: Name of the attribute.
                example: Segment LCD Controller
              href:
                type: string
                format: uri
                description: URL for the attribute.
                example: /product-parts/attributes/field__segment_lcd_controller
              attributeValues:
                type: array
                description: List of values for the attribute.
                items:
                  oneOf:
                    - type: string
                      description: A single value for the attribute.
                    - type: number
                      format: float
                      description: A numeric value for the attribute.
                    - type: boolean
                      description: A boolean value for the attribute.
                example:
                  - Value1
                  - Value2
                  - 3.14
                  - true
              attributeValuesParsed:
                type: array
                description: >
                  Parsed representation of `attributeValues` for attributes with
                  structured string formats. Present only when the raw values
                  can be parsed into a known type. Entity references (`GP`,
                  `BK`, `DOC`, `OP`) include an `href` pointing to the
                  corresponding API resource. URL references include a `url`
                  field for the external link.
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      description: |
                        Identifies the reference syntax:
                        - `GP` — Generic Product (resolved by product ID)
                        - `BK` — Board/Kit (resolved by product ID)
                        - `DOC` — Document (resolved by Agile ID)
                        - `OP` — Orderable Part (resolved by part number)
                        - `URL` — Arbitrary external URL with display label
                      enum:
                        - GP
                        - BK
                        - DOC
                        - OP
                        - URL
                    value:
                      type: string
                      description: >-
                        The ID, part number, or display label depending on
                        `type`.
                      example: RA2E1
                    href:
                      type: string
                      description: >-
                        API path to the referenced resource. Present for `GP`,
                        `BK`, `DOC`, and `OP` types.
                      example: /products/RA2E1
                    url:
                      type: string
                      description: External URL. Present for `URL` type only.
                      example: >-
                        https://www.renesas.com/products/microcontrollers-microprocessors/ra-cortex-m-mcus/ra2e1-48mhz-arm-cortex-m23-entry-level-general-purpose-microcontroller
